name: Build release archives

# Builds crowdsec, crowdsec-firewall-bouncer (from the FreeBSD ports tree) and
# pfSense-pkg-crowdsec (from this repo) inside FreeBSD VMs, and publishes
# freebsd-<major>-<arch>.tar archives in the layout expected by
# install-crowdsec.sh.
#
# Tag format: v<pfSense-pkg-crowdsec version>-<crowdsec version>-<bouncer build>
# e.g. v0.2.0-1.8.2-38
#
# Triggers:
#   - push to main that touches the package Makefile (this is how the pull
#     requests opened by watch-upstream.yml start a release): builds with the
#     defaults below, publishes a pre-release, then starts the aarch64 builds.
#     Skipped when a release for that package version already exists.
#   - manual run, with the inputs below.

on:
  push:
    branches: [main]
    paths:
      - security/pfSense-pkg-crowdsec/Makefile
  workflow_dispatch:
    inputs:
      ports_ref:
        description: "FreeBSD ports tree branch/tag/commit to build from"
        default: "main"
      expected_crowdsec_version:
        description: "Fail if the ports tree does not provide this crowdsec version (empty = don't check)"
        default: ""
      prerelease:
        description: "Publish as a pre-release"
        type: boolean
        default: true
      freebsd16_runner:
        description: "Where to build FreeBSD 16 amd64: a GitHub-hosted runner (KVM), your self-hosted runner (label freebsd-vm), or not at all"
        type: choice
        options: [hosted, self-hosted, skip]
        default: hosted
      with_aarch64:
        description: "After publishing, start build-release-aarch64.yml and attach its archives to the release"
        type: boolean
        default: false
      publish:
        description: "Create the GitHub release (otherwise only upload workflow artifacts)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    name: Plan the build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.p.outputs.skip }}
      ports_ref: ${{ steps.p.outputs.ports_ref }}
      expected: ${{ steps.p.outputs.expected }}
      prerelease: ${{ steps.p.outputs.prerelease }}
      runner: ${{ steps.p.outputs.runner }}
      publish: ${{ steps.p.outputs.publish }}
      aarch64: ${{ steps.p.outputs.aarch64 }}
    steps:
      - uses: actions/checkout@v4

      - id: p
        env:
          EVENT: ${{ github.event_name }}
          IN_PORTS_REF: ${{ inputs.ports_ref }}
          IN_EXPECTED: ${{ inputs.expected_crowdsec_version }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          IN_RUNNER: ${{ inputs.freebsd16_runner }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_AARCH64: ${{ inputs.with_aarch64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mk=security/pfSense-pkg-crowdsec/Makefile
          cs_min=$(sed -n 's/.*[[:space:]=]crowdsec>=\([^:]*\):.*/\1/p' "$mk" | head -n1)
          pkg=$(sed -n 's/^PORTVERSION=[[:space:]]*//p' "$mk")
          skip=false
          if [ "$EVENT" = workflow_dispatch ]; then
            ports_ref=$IN_PORTS_REF; expected=$IN_EXPECTED; prerelease=$IN_PRERELEASE
            runner=$IN_RUNNER; publish=$IN_PUBLISH; aarch64=$IN_AARCH64
          else
            ports_ref=main; expected=${cs_min%%_*}; prerelease=true
            runner=hosted; publish=true; aarch64=true
            # a push that did not bump the package version builds nothing
            if gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -q "^v${pkg}-"; then
              echo "a release for package version $pkg already exists: nothing to build"
              skip=true
            fi
          fi
          {
            echo "skip=$skip"
            echo "ports_ref=$ports_ref"
            echo "expected=$expected"
            echo "prerelease=$prerelease"
            echo "runner=$runner"
            echo "publish=$publish"
            echo "aarch64=$aarch64"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: FreeBSD ${{ matrix.release }} ${{ matrix.arch }}
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # vmactions/freebsd-vm has no FreeBSD 16 image, so 16 is built by the
          # FreeBSD 16 job below. aarch64 lives in build-release-aarch64.yml
          # (emulated, slow); armv7 is not built.
          - release: "15.0"
            arch: amd64
          - release: "14.3"
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Build packages in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          PORTS_REF: ${{ needs.prepare.outputs.ports_ref }}
          EXPECTED_CROWDSEC: ${{ needs.prepare.outputs.expected }}
          FBSD_RELEASE: ${{ matrix.release }}
          FBSD_ARCH: ${{ matrix.arch }}
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: "PORTS_REF EXPECTED_CROWDSEC FBSD_RELEASE FBSD_ARCH"
          usesh: true
          mem: 8192
          prepare: |
            pkg install -y git gmake
          run: |
            sh scripts/build-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-${{ matrix.release }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  build-freebsd16:
    name: FreeBSD 16.0 amd64 (${{ needs.prepare.outputs.runner }})
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.runner != 'skip' }}
    runs-on: ${{ needs.prepare.outputs.runner == 'self-hosted' && fromJSON('["self-hosted","linux","freebsd-vm"]') || 'ubuntu-latest' }}
    # emulated (no KVM on a self-hosted host) this takes hours; GitHub-hosted jobs stop at 6h
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the GitHub-hosted runner (QEMU, KVM, scratch disk)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage xz-utils
          # let the runner user open /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # fail fast instead of silently falling back to a many-hour emulated build
          ls -l /dev/kvm || { echo "no /dev/kvm on this runner" >&2; exit 1; }
          # the VM image and its overlay are big: keep them on the large /mnt disk
          sudo mkdir -p /mnt/vm
          sudo chown "$USER" /mnt/vm
          df -h / /mnt

      - name: Get the FreeBSD 16 VM image
        env:
          # self-hosted: optional repository variable, otherwise ~/FreeBSD-16.0-CURRENT-amd64-BASIC-CLOUDINIT-ufs.qcow2
          FREEBSD_IMAGE: ${{ runner.environment == 'github-hosted' && '/mnt/vm/freebsd16.qcow2' || vars.FREEBSD16_IMAGE }}
        run: |
          set -eu
          IMG=${FREEBSD_IMAGE:-$HOME/FreeBSD-16.0-CURRENT-amd64-BASIC-CLOUDINIT-ufs.qcow2}
          if [ -e "$IMG" ]; then echo "using existing $IMG"; exit 0; fi
          base=https://download.freebsd.org/snapshots/VM-IMAGES/16.0-CURRENT/amd64/Latest
          f=FreeBSD-16.0-CURRENT-amd64-BASIC-CLOUDINIT-ufs.qcow2.xz
          curl -fL --retry 3 -o "$IMG.xz" "$base/$f"
          curl -fL --retry 3 -o "$RUNNER_TEMP/CHECKSUM.SHA256" "$base/CHECKSUM.SHA256"
          # the checksum file lists the dated names (e.g. ...CLOUDINIT-20261102-<rev>-ufs.qcow2.xz),
          # while Latest/ serves the undated name: match the one UFS qcow2 cloud-init line
          line=$(grep -E 'BASIC-CLOUDINIT-.*-ufs\.qcow2\.xz\)' "$RUNNER_TEMP/CHECKSUM.SHA256")
          [ "$(printf '%s\n' "$line" | wc -l)" -eq 1 ] || { echo "expected exactly one checksum line, got: $line" >&2; exit 1; }
          expected=${line##*= }
          echo "$expected  $IMG.xz" | sha256sum -c -
          xz -d "$IMG.xz"

      - name: Build packages in a QEMU FreeBSD 16 VM
        env:
          FREEBSD_IMAGE: ${{ runner.environment == 'github-hosted' && '/mnt/vm/freebsd16.qcow2' || vars.FREEBSD16_IMAGE }}
          PORTS_REF: ${{ needs.prepare.outputs.ports_ref }}
          EXPECTED_CROWDSEC: ${{ needs.prepare.outputs.expected }}
          FBSD_RELEASE: "16.0"
          FBSD_ARCH: amd64
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then export TMPDIR=/mnt/vm; fi
          scripts/run-in-freebsd-vm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-16.0-amd64
          path: out/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build, build-freebsd16]
    # the FreeBSD 16 job is skipped when freebsd16_runner is 'skip'; a failure blocks the release
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.publish == 'true' && needs.build.result == 'success' && (needs.build-freebsd16.result == 'success' || needs.build-freebsd16.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4   # for scripts/release-notes.sh and the changelog

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute tag and check version consistency
        id: tag
        run: |
          set -eu
          # every build must have used the same package versions
          [ "$(cat artifacts/*/versions.txt | sort -u | wc -l)" -eq 3 ] || { echo "versions differ between builds" >&2; cat artifacts/*/versions.txt; exit 1; }
          . "$(ls artifacts/*/versions.txt | head -n 1)"
          # bouncer version looks like 0.0.34 or 0.0.34_1: use the last number as build id
          BN=${bouncer%%_*}; BN=${BN##*.}
          echo "tag=v${pfsense_pkg%%_*}-${crowdsec%%_*}-${BN}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          scripts/release-notes.sh "${{ steps.tag.outputs.tag }}" \
            "$(ls artifacts/*/versions.txt | head -n 1)" artifacts > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: artifacts/*/freebsd-*.tar

  aarch64:
    name: Start the aarch64 builds
    needs: [prepare, release]
    if: ${{ needs.release.result == 'success' && needs.prepare.outputs.aarch64 == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch build-release-aarch64.yml for the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-release-aarch64.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f release_tag="${{ needs.release.outputs.tag }}" \
            -f ports_ref="${{ needs.prepare.outputs.ports_ref }}" \
            -f expected_crowdsec_version="${{ needs.prepare.outputs.expected }}" \
            -f freebsd16_runner=hosted \
            -f publish=true

  notify-failure:
    name: Report a failed automatic build
    needs: [prepare, build, build-freebsd16, release]
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create automated --color ededed --description "opened by a workflow" --repo "$GITHUB_REPOSITORY" 2> /dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label automated \
            --title "The automatic release build failed ($GITHUB_SHA)" \
            --body "The release build started by the push to main failed: $url. Fix the cause and re-run it from the Actions tab (Build release archives, Run workflow)."
