name: Build release archives

# Builds crowdsec, crowdsec-firewall-bouncer (from the FreeBSD ports tree) and
# pfSense-pkg-crowdsec (from this repo) inside FreeBSD VMs, and publishes
# freebsd-<major>-<arch>.tar archives in the layout expected by
# install-crowdsec.sh.
#
# Tag format: v<pfSense-pkg-crowdsec version>-<crowdsec version>-<bouncer build>
# e.g. v0.1.8-1.8.1-34

on:
  workflow_dispatch:
    inputs:
      ports_ref:
        description: "FreeBSD ports tree branch/tag/commit to build from"
        default: "main"
      expected_crowdsec_version:
        description: "Fail if the ports tree does not provide this crowdsec version (empty = don't check)"
        default: "1.8.1"
      prerelease:
        description: "Publish as a pre-release"
        type: boolean
        default: true
      build_freebsd16_selfhosted:
        description: "Also build FreeBSD 16 (amd64 + aarch64) on the self-hosted runner (label: freebsd-vm). Untick if the runner is offline."
        type: boolean
        default: true
      publish:
        description: "Create the GitHub release (otherwise only upload workflow artifacts)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: FreeBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # vmactions/freebsd-vm has no armv7 images or FreeBSD 16 image, so
          # freebsd-*-armv7 archives are not built and 16 is built by the
          # self-hosted job below. aarch64 runs under QEMU emulation and is much
          # slower than amd64.
          - release: "15.0"
            arch: amd64
          - release: "15.0"
            arch: aarch64
          - release: "14.3"
            arch: amd64
          - release: "14.3"
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Build packages in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          PORTS_REF: ${{ inputs.ports_ref }}
          EXPECTED_CROWDSEC: ${{ inputs.expected_crowdsec_version }}
          FBSD_RELEASE: ${{ matrix.release }}
          FBSD_ARCH: ${{ matrix.arch }}
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: "PORTS_REF EXPECTED_CROWDSEC FBSD_RELEASE FBSD_ARCH"
          usesh: true
          mem: 8192
          prepare: |
            pkg install -y git gmake
          run: |
            sh scripts/build-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-${{ matrix.release }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  build-freebsd16-selfhosted:
    name: FreeBSD 16.0 ${{ matrix.arch }} (self-hosted)
    if: ${{ inputs.build_freebsd16_selfhosted }}
    runs-on: [self-hosted, linux, freebsd-vm]
    timeout-minutes: 720
    strategy:
      fail-fast: false
      # same runner label for both: with one runner they run one after the other.
      # aarch64 is emulated (slow) unless the runner host is arm64.
      max-parallel: 1
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Build packages in a QEMU FreeBSD 16 VM
        env:
          # Optional repository variables; the script defaults to
          # ~/FreeBSD-16.0-CURRENT-<amd64|arm64-aarch64>-BASIC-CLOUDINIT-ufs.qcow2.
          FREEBSD_IMAGE: ${{ matrix.arch == 'amd64' && vars.FREEBSD16_IMAGE || vars.FREEBSD16_IMAGE_AARCH64 }}
          PORTS_REF: ${{ inputs.ports_ref }}
          EXPECTED_CROWDSEC: ${{ inputs.expected_crowdsec_version }}
          FBSD_RELEASE: "16.0"
          FBSD_ARCH: ${{ matrix.arch }}
        run: scripts/run-in-freebsd-vm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-16.0-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-freebsd16-selfhosted]
    # the self-hosted job is skipped when its input is unticked; a failure blocks the release
    if: ${{ !cancelled() && inputs.publish && needs.build.result == 'success' && (needs.build-freebsd16-selfhosted.result == 'success' || needs.build-freebsd16-selfhosted.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute tag and check version consistency
        id: tag
        run: |
          set -eu
          # every build must have used the same package versions
          [ "$(cat artifacts/*/versions.txt | sort -u | wc -l)" -eq 3 ] || { echo "versions differ between builds" >&2; cat artifacts/*/versions.txt; exit 1; }
          . "$(ls artifacts/*/versions.txt | head -n 1)"
          # bouncer version looks like 0.0.34 or 0.0.34_1: use the last number as build id
          BN=${bouncer%%_*}; BN=${BN##*.}
          echo "tag=v${pfsense_pkg%%_*}-${crowdsec%%_*}-${BN}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: artifacts/*/freebsd-*.tar
