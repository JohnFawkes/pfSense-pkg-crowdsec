name: Build release archives (aarch64, slow)

# aarch64 counterpart of build-release.yml. Everything here runs under QEMU
# emulation (the runners are x86), so it is slow: expect many hours. Kept in its
# own workflow so the normal amd64 release is not held up by it.
#
# With `publish`, the archives are attached to the release with the same tag
# scheme as build-release.yml (v<pkg>-<crowdsec>-<bouncer build>), creating it
# if it does not exist yet. Run build-release.yml first if you want both sets in
# one release; the tag matches only when both builds saw the same versions.

on:
  workflow_dispatch:
    inputs:
      ports_ref:
        description: "FreeBSD ports tree branch/tag/commit to build from"
        default: "main"
      expected_crowdsec_version:
        description: "Fail if the ports tree does not provide this crowdsec version (empty = don't check)"
        default: "1.8.1"
      prerelease:
        description: "Publish as a pre-release"
        type: boolean
        default: true
      build_freebsd16_selfhosted:
        description: "Also build FreeBSD 16 aarch64 on the self-hosted runner (label: freebsd-vm). Untick if the runner is offline."
        type: boolean
        default: true
      publish:
        description: "Create the GitHub release (otherwise only upload workflow artifacts)"
        type: boolean
        default: true
      release_tag:
        description: "Attach the archives to this EXISTING release tag (e.g. v0.1.9-1.8.1-38) instead of computing one; its name and pre-release flag are left alone"
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: FreeBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - release: "15.0"
            arch: aarch64
          - release: "14.3"
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Build packages in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          PORTS_REF: ${{ inputs.ports_ref }}
          EXPECTED_CROWDSEC: ${{ inputs.expected_crowdsec_version }}
          FBSD_RELEASE: ${{ matrix.release }}
          FBSD_ARCH: ${{ matrix.arch }}
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: "PORTS_REF EXPECTED_CROWDSEC FBSD_RELEASE FBSD_ARCH"
          usesh: true
          mem: 8192
          prepare: |
            pkg install -y git gmake
          run: |
            sh scripts/build-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-${{ matrix.release }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  build-freebsd16-selfhosted:
    name: FreeBSD 16.0 aarch64 (self-hosted)
    if: ${{ inputs.build_freebsd16_selfhosted }}
    runs-on: [self-hosted, linux, freebsd-vm]
    # emulated on an x86 host: this can take a day or more
    timeout-minutes: 2880
    steps:
      - uses: actions/checkout@v4

      - name: Build packages in a QEMU FreeBSD 16 VM
        env:
          # Optional repository variables; the script defaults to
          # ~/FreeBSD-16.0-CURRENT-arm64-aarch64-BASIC-CLOUDINIT-ufs.qcow2.
          FREEBSD_IMAGE: ${{ vars.FREEBSD16_IMAGE_AARCH64 }}
          PORTS_REF: ${{ inputs.ports_ref }}
          EXPECTED_CROWDSEC: ${{ inputs.expected_crowdsec_version }}
          FBSD_RELEASE: "16.0"
          FBSD_ARCH: aarch64
          VM_CPUS: ${{ vars.FREEBSD_VM_CPUS || '4' }}
          VM_MEM: ${{ vars.FREEBSD_VM_MEM || '8192' }}
        run: scripts/run-in-freebsd-vm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-16.0-aarch64
          path: out/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-freebsd16-selfhosted]
    # the self-hosted job is skipped when its input is unticked; a failure blocks the release
    if: ${{ !cancelled() && inputs.publish && needs.build.result == 'success' && (needs.build-freebsd16-selfhosted.result == 'success' || needs.build-freebsd16-selfhosted.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute tag and check version consistency
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # every build must have used the same package versions
          [ "$(cat artifacts/*/versions.txt | sort -u | wc -l)" -eq 3 ] || { echo "versions differ between builds" >&2; cat artifacts/*/versions.txt; exit 1; }
          if [ -n "$RELEASE_TAG" ]; then
            # attach to an existing release; refuse to create a new one by typo
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          . "$(ls artifacts/*/versions.txt | head -n 1)"
          # bouncer version looks like 0.0.34 or 0.0.34_1: use the last number as build id
          BN=${bouncer%%_*}; BN=${BN##*.}
          echo "tag=v${pfsense_pkg%%_*}-${crowdsec%%_*}-${BN}" >> "$GITHUB_OUTPUT"

      # With release_tag, name and prerelease are left empty so softprops keeps
      # the existing release's values instead of overwriting them.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ inputs.release_tag == '' && steps.tag.outputs.tag || '' }}
          prerelease: ${{ inputs.release_tag == '' && inputs.prerelease || '' }}
          files: artifacts/*/freebsd-*.tar
