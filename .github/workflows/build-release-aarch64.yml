name: Build release archives (aarch64, slow)

# aarch64 counterpart of build-release.yml. Everything here runs under QEMU
# emulation (the runners are x86), so it is slow: expect several hours per job.
# Kept in its own workflow so the normal amd64 release is not held up by it.
#
# build-release.yml starts this automatically after publishing a release and
# passes that release's tag as `release_tag`, so the archives are attached to it.
# Without `release_tag`, the tag is computed like build-release.yml does
# (v<pkg>-<crowdsec>-<bouncer build>) and the release is created if needed.

on:
  workflow_dispatch:
    inputs:
      ports_ref:
        description: "FreeBSD ports tree branch/tag/commit to build from"
        default: "main"
      expected_crowdsec_version:
        description: "Fail if the ports tree does not provide this crowdsec version (empty = don't check)"
        default: ""
      prerelease:
        description: "Publish as a pre-release"
        type: boolean
        default: true
      freebsd16_runner:
        description: "Where to build FreeBSD 16 aarch64 (emulated): a GitHub-hosted runner, your self-hosted runner (label freebsd-vm), or not at all"
        type: choice
        options: [hosted, self-hosted, skip]
        default: hosted
      publish:
        description: "Create the GitHub release (otherwise only upload workflow artifacts)"
        type: boolean
        default: true
      reuse_run_id:
        description: "Skip the builds and publish the artifacts of this earlier run instead (needs release_tag)"
        default: ""
      mark_release:
        description: "With release_tag: turn that release from a pre-release into a normal 'latest' release right away"
        type: boolean
        default: false
      release_tag:
        description: "Attach the archives to this EXISTING release tag (e.g. v0.1.9-1.8.1-38) instead of computing one; its name and pre-release flag are left alone"
        default: ""

permissions:
  contents: read

jobs:
  release-meta:
    name: Refresh the release notes${{ inputs.mark_release && ' and mark the release' || '' }}
    if: ${{ inputs.release_tag != '' && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update the release (archives table, pre-release flag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MARK: ${{ inputs.mark_release && '--mark-release' || '' }}
        run: scripts/refresh-release.sh "${{ inputs.release_tag }}" $MARK

  build:
    name: FreeBSD ${{ matrix.release }} ${{ matrix.arch }}
    if: ${{ inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "15.0"
            arch: aarch64
          - release: "14.3"
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Build packages in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          PORTS_REF: ${{ inputs.ports_ref }}
          EXPECTED_CROWDSEC: ${{ inputs.expected_crowdsec_version }}
          FBSD_RELEASE: ${{ matrix.release }}
          FBSD_ARCH: ${{ matrix.arch }}
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: "PORTS_REF EXPECTED_CROWDSEC FBSD_RELEASE FBSD_ARCH"
          usesh: true
          mem: 8192
          prepare: |
            pkg install -y git gmake
          run: |
            sh scripts/build-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-${{ matrix.release }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  build-freebsd16:
    name: FreeBSD 16.0 aarch64 (${{ inputs.freebsd16_runner }})
    if: ${{ inputs.freebsd16_runner != 'skip' && inputs.reuse_run_id == '' }}
    runs-on: ${{ inputs.freebsd16_runner == 'self-hosted' && fromJSON('["self-hosted","linux","freebsd-vm"]') || 'ubuntu-latest' }}
    # emulated: about 3 hours on a 4-core runner; GitHub-hosted jobs stop at 6h
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the GitHub-hosted runner (QEMU, UEFI firmware, scratch disk)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 qemu-utils genisoimage xz-utils
          # the VM image and its overlay are big: keep them on the large /mnt disk
          sudo mkdir -p /mnt/vm
          sudo chown "$USER" /mnt/vm
          df -h / /mnt

      - name: Get the FreeBSD 16 aarch64 VM image
        env:
          # self-hosted: optional repository variable, otherwise ~/FreeBSD-16.0-CURRENT-arm64-aarch64-BASIC-CLOUDINIT-ufs.qcow2
          FREEBSD_IMAGE: ${{ runner.environment == 'github-hosted' && '/mnt/vm/freebsd16-aarch64.qcow2' || vars.FREEBSD16_IMAGE_AARCH64 }}
        run: |
          set -eu
          IMG=${FREEBSD_IMAGE:-$HOME/FreeBSD-16.0-CURRENT-arm64-aarch64-BASIC-CLOUDINIT-ufs.qcow2}
          if [ -e "$IMG" ]; then echo "using existing $IMG"; exit 0; fi
          base=https://download.freebsd.org/snapshots/VM-IMAGES/16.0-CURRENT/aarch64/Latest
          f=FreeBSD-16.0-CURRENT-arm64-aarch64-BASIC-CLOUDINIT-ufs.qcow2.xz
          curl -fL --retry 3 -o "$IMG.xz" "$base/$f"
          curl -fL --retry 3 -o "$RUNNER_TEMP/CHECKSUM.SHA256" "$base/CHECKSUM.SHA256"
          # the checksum file lists the dated names: match the one UFS qcow2 cloud-init line
          line=$(grep -E 'BASIC-CLOUDINIT-.*-ufs\.qcow2\.xz\)' "$RUNNER_TEMP/CHECKSUM.SHA256")
          [ "$(printf '%s\n' "$line" | wc -l)" -eq 1 ] || { echo "expected exactly one checksum line, got: $line" >&2; exit 1; }
          expected=${line##*= }
          echo "$expected  $IMG.xz" | sha256sum -c -
          xz -d "$IMG.xz"

      - name: Build packages in a QEMU FreeBSD 16 VM
        env:
          FREEBSD_IMAGE: ${{ runner.environment == 'github-hosted' && '/mnt/vm/freebsd16-aarch64.qcow2' || vars.FREEBSD16_IMAGE_AARCH64 }}
          PORTS_REF: ${{ inputs.ports_ref }}
          EXPECTED_CROWDSEC: ${{ inputs.expected_crowdsec_version }}
          FBSD_RELEASE: "16.0"
          FBSD_ARCH: aarch64
          VM_CPUS: ${{ vars.FREEBSD_VM_CPUS || '4' }}
          VM_MEM: ${{ vars.FREEBSD_VM_MEM || '8192' }}
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then export TMPDIR=/mnt/vm; fi
          scripts/run-in-freebsd-vm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-16.0-aarch64
          path: out/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-freebsd16]
    # the FreeBSD 16 job is skipped when freebsd16_runner is 'skip' or when reusing a run; a failure blocks the release
    if: ${{ !cancelled() && inputs.publish && (inputs.reuse_run_id != '' || (needs.build.result == 'success' && (needs.build-freebsd16.result == 'success' || needs.build-freebsd16.result == 'skipped'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read   # download artifacts of another run (reuse_run_id)
    steps:
      - uses: actions/checkout@v4   # for scripts/refresh-release.sh

      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run_id == '' }}
        with:
          path: artifacts

      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run_id != '' }}
        with:
          path: artifacts
          run-id: ${{ inputs.reuse_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Compute tag and check version consistency
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -n "${REUSE_RUN_ID:-}" ] && [ -z "$RELEASE_TAG" ]; then
            echo "reuse_run_id needs release_tag" >&2; exit 1
          fi
          ls -l artifacts/*/
          # every build must have used the same package versions
          [ "$(cat artifacts/*/versions.txt | sort -u | wc -l)" -eq 3 ] || { echo "versions differ between builds" >&2; cat artifacts/*/versions.txt; exit 1; }
          if [ -n "$RELEASE_TAG" ]; then
            # attach to an existing release; refuse to create a new one by typo
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          . "$(ls artifacts/*/versions.txt | head -n 1)"
          # bouncer version looks like 0.0.34 or 0.0.34_1: use the last number as build id
          BN=${bouncer%%_*}; BN=${BN##*.}
          echo "tag=v${pfsense_pkg%%_*}-${crowdsec%%_*}-${BN}" >> "$GITHUB_OUTPUT"

      # With release_tag, name and prerelease are left empty so softprops keeps
      # the existing release's values instead of overwriting them.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ inputs.release_tag == '' && steps.tag.outputs.tag || '' }}
          prerelease: ${{ inputs.release_tag == '' && inputs.prerelease || '' }}
          files: artifacts/*/freebsd-*.tar

      - name: Refresh the archives table of the release notes
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/refresh-release.sh "${{ inputs.release_tag }}"
